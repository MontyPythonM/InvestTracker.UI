<div class="container">
  <h1 *ngIf="title" class="title">{{ title }}</h1>

  <button mat-raised-button *ngIf="showAddButton" class="button" color="primary" (click)="addButtonAction!.action()">
    <mat-icon>add</mat-icon>
    <span>Add</span>
  </button>

  <div *ngIf="data?.totalResults === 0" class="info">
    <h2>No records found</h2>
  </div>

  <div *ngIf="data?.totalResults !== 0" class="table">
    <dx-data-grid
      id="dataGrid"
      keyExpr="id"
      [dataSource]="data?.items!"
      [showBorders]="true"
      [hoverStateEnabled]="true"
      (onRowClick)="navigateToDetails($event.data.id)">

      <dxo-paging [enabled]="false"></dxo-paging>
      <dxo-pager [showPageSizeSelector]="false"></dxo-pager>

      <dxi-column
        *ngFor="let column of columns"
        [dataField]="column.columnDef"
        [caption]="column.header"
        alignment="center">
      </dxi-column>
    </dx-data-grid>

    <app-paginator [pagedResponse]="data" (pageChanged)="onPageChanged($event)"></app-paginator>
  </div>
</div>
